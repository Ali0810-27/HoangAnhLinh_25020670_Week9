name: Pull Request Automated Code Review

on:
  pull_request:
    branches: [ main, master ]
    types: [ opened, synchronize, reopened ]

jobs:
  checkstyle-review:
    name: Checkstyle Automated Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Checkstyle
        run: |
          mvn checkstyle:checkstyle --batch-mode || true

      - name: Checkstyle Reviewdog / Action Checkstyle
        uses: dbelyaev/action-checkstyle@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_file: 'bai-07-pr-code-review/target/checkstyle-result.xml'
          reporter: github-pr-review
          level: error
