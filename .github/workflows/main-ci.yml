name: Multi-Module Maven CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  matrix-build-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 with Maven Caching (Bài 6)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Test all modules (Bài 1, 2, 4)
        run: mvn clean test --batch-mode

  verify-and-package:
    name: Verify, Coverage Check & Artifact Packaging
    runs-on: ubuntu-latest
    needs: matrix-build-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Verify (Checkstyle & JaCoCo Coverage >= 80%)
        run: mvn clean verify --batch-mode

      - name: Package Executable JARs (Bài 8)
        run: mvn package -DskipTests --batch-mode

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: bai-05-jacoco-coverage/target/site/jacoco/
          retention-days: 14

      - name: Upload Executable JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: executable-apps
          path: |
            bai-03-ci-automation/target/*.jar
            bai-08-executable-jar/target/*.jar
          retention-days: 14
